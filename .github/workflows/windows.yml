name: Windows build and tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test-and-package:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Encdr helper
        run: cargo build --manifest-path native/encdr_bridge/Cargo.toml --release
      - name: Rust helper tests (Windows HID / NI service protocol)
        run: cargo test --manifest-path native/encdr_bridge/Cargo.toml --release
      - name: Prepare release artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/KompleteSynthesia-win/bin | Out-Null
          Copy-Item native/encdr_bridge/target/release/encdr_bridge.exe dist/KompleteSynthesia-win/bin/
          Copy-Item -Recurse kompletesynthesia dist/KompleteSynthesia-win/
          Copy-Item requirements.txt,README.md,LICENSE dist/KompleteSynthesia-win/
          Get-ChildItem -Path dist/KompleteSynthesia-win/kompletesynthesia -Recurse -Directory -Filter __pycache__ | Remove-Item -Recurse -Force
      - uses: actions/upload-artifact@v4
        with:
          name: KompleteSynthesia-win-W11
          path: dist/KompleteSynthesia-win/
