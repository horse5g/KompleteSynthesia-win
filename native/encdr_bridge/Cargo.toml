[package]
name = "encdr_bridge"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
encdr = "=0.9.0"
serde_json = "1"
tracing = "0.1"

[target.'cfg(windows)'.dependencies]
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem",
    "Win32_System_IO", "Win32_System_Pipes"
] }
